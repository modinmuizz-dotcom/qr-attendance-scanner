<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>QR Attendance Scanner</title>

<script src="https://script.google.com/macros/s/AKfycbyo6jsCB-9RW9qILTMoEuSvc9R-EChW7HN_7OeKwx7IaKdoxE4SFj_K66PntzC0dTPZ/exec"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 20px;

  background: #f3f4f6;

  font-family:
    Arial,
    sans-serif;

}

.container {

  width: 100%;

  max-width: 650px;

  margin: auto;

  background: white;

  padding: 25px;

  border-radius: 18px;

  box-shadow:
    0 5px 25px rgba(0,0,0,.10);

}

h1 {

  text-align: center;

  margin-top: 0;

  color: #111827;

  font-size: 28px;

}

#status {

  display: none;

  padding: 14px;

  border-radius: 10px;

  text-align: center;

  margin: 15px 0;

  font-weight: bold;

}

.info {

  background: #e0f2fe;

  color: #075985;

}

.success {

  background: #dcfce7;

  color: #166534;

}

.error {

  background: #fee2e2;

  color: #991b1b;

}

#reader {

  width: 100%;

  max-width: 500px;

  margin: 20px auto;

  overflow: hidden;

  border-radius: 15px;

}

#details {

  display: none;

  margin-top: 20px;

}

.detail {

  display: flex;

  justify-content: space-between;

  gap: 20px;

  padding: 14px 5px;

  border-bottom:
    1px solid #e5e7eb;

}

.label {

  font-weight: bold;

  color: #374151;

}

.value {

  text-align: right;

  color: #111827;

  word-break: break-word;

}

.buttons {

  display: none;

  gap: 15px;

  margin-top: 25px;

}

button {

  flex: 1;

  border: none;

  padding: 17px;

  border-radius: 12px;

  font-size: 18px;

  font-weight: bold;

  cursor: pointer;

}

#inButton {

  background: #16a34a;

  color: white;

}

#outButton {

  background: #dc2626;

  color: white;

}

button:disabled {

  opacity: .5;

  cursor: not-allowed;

}

#scanAgain {

  display: none;

  width: 100%;

  margin-top: 15px;

  background: #2563eb;

  color: white;

}

.help {

  text-align: center;

  color: #6b7280;

  font-size: 14px;

  margin-top: 10px;

}

@media(max-width:500px) {

  body {
    padding: 10px;
  }

  .container {
    padding: 18px;
  }

  h1 {
    font-size: 23px;
  }

  .detail {
    display: block;
  }

  .value {
    text-align: left;
    margin-top: 5px;
  }

  .buttons {
    flex-direction: column;
  }

}

</style>

</head>


<body>


<div class="container">

<h1>
  QR Attendance Scanner
</h1>


<div id="status"></div>


<div id="reader"></div>


<div class="help">
  Scan the operator QR code.
</div>


<!-- SCANNED INFORMATION -->

<div id="details">


  <div class="detail">

    <span class="label">
      Operator / Driver
    </span>

    <span
      class="value"
      id="operator"
    ></span>

  </div>


  <div class="detail">

    <span class="label">
      Start Time
    </span>

    <span
      class="value"
      id="startTime"
    >
      —
    </span>

  </div>


  <div class="detail">

    <span class="label">
      End Time
    </span>

    <span
      class="value"
      id="endTime"
    >
      —
    </span>

  </div>


  <div class="detail">

    <span class="label">
      Date
    </span>

    <span
      class="value"
      id="date"
    ></span>

  </div>


  <div class="detail">

    <span class="label">
      Operating Hrs
    </span>

    <span
      class="value"
      id="operatingHrs"
    >
      —
    </span>

  </div>


</div>


<!-- IN / OUT -->

<div
  class="buttons"
  id="buttons"
>

  <button
    id="inButton"
    onclick="recordIN()"
  >
    IN
  </button>


  <button
    id="outButton"
    onclick="recordOUT()"
  >
    OUT
  </button>

</div>


<button
  id="scanAgain"
  onclick="resetScanner()"
>
  SCAN AGAIN
</button>


</div>


<script>


/*******************************************************
 * IMPORTANT
 *
 * PUT YOUR APPS SCRIPT /exec URL HERE
 *******************************************************/

const APPS_SCRIPT_URL =
  "PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE";


/*******************************************************
 * VARIABLES
 *******************************************************/

let scanner = null;

let scannedOperator = null;

let scanTime = null;

let processing = false;


/*******************************************************
 * START
 *******************************************************/

window.addEventListener(
  "load",
  startScanner
);


/*******************************************************
 * START CAMERA
 *******************************************************/

async function startScanner() {

  try {

    if (
      !window.isSecureContext
    ) {

      throw new Error(
        "HTTPS_REQUIRED"
      );

    }


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "CAMERA_NOT_SUPPORTED"
      );

    }


    showStatus(
      "Requesting camera permission...",
      "info"
    );


    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        });


    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );


    createScanner();


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );


    let message =
      "Unable to open camera.";


    if (
      error.message ===
      "HTTPS_REQUIRED"
    ) {

      message =
        "Camera requires HTTPS. Open the GitHub Pages URL.";

    }


    else if (
      error.name ===
      "NotAllowedError"
    ) {

      message =
        "Camera permission was denied. Allow camera access and reload.";

    }


    else if (
      error.name ===
      "NotFoundError"
    ) {

      message =
        "No camera was found.";

    }


    else if (
      error.name ===
      "NotReadableError"
    ) {

      message =
        "Camera is being used by another application.";

    }


    showStatus(
      message,
      "error"
    );

  }

}


/*******************************************************
 * CREATE SCANNER
 *******************************************************/

function createScanner() {

  document.getElementById(
    "reader"
  ).innerHTML = "";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const width =
    document.getElementById(
      "reader"
    ).clientWidth || 300;


  const qrSize =
    Math.min(
      Math.max(
        width * 0.70,
        220
      ),
      350
    );


  scanner
    .start(

      {
        facingMode:
          "environment"
      },

      {

        fps: 10,

        qrbox: {

          width: qrSize,

          height: qrSize

        },

        aspectRatio: 1.0

      },

      onScanSuccess,

      onScanFailure

    )

    .then(() => {

      showStatus(
        "Camera ready. Scan an operator QR code.",
        "success"
      );

    })

    .catch(error => {

      console.error(
        error
      );

      showStatus(
        "Unable to start QR scanner.",
        "error"
      );

    });

}


/*******************************************************
 * SCAN FAILURE
 *******************************************************/

function onScanFailure() {

  // Normal scanning failures
  // are ignored.

}


/*******************************************************
 * SUCCESSFUL SCAN
 *******************************************************/

async function onScanSuccess(
  decodedText
) {

  if (processing) {
    return;
  }


  processing = true;


  /***************************************************
   * ACTUAL QR SCAN TIME
   ***************************************************/

  scanTime =
    new Date()
      .toISOString();


  await stopScanner();


  let data;


  /***************************************************
   * PARSE QR JSON
   ***************************************************/

  try {

    data =
      JSON.parse(
        decodedText
      );

  } catch (error) {

    processing = false;

    showStatus(
      "Invalid QR code. QR must contain JSON.",
      "error"
    );

    showScanAgain();

    return;

  }


  /***************************************************
   * VALIDATE OBJECT
   ***************************************************/

  if (
    !data ||
    typeof data !== "object" ||
    Array.isArray(data)
  ) {

    processing = false;

    showStatus(
      "Invalid QR data.",
      "error"
    );

    showScanAgain();

    return;

  }


  /***************************************************
   * ACTUAL QR FIELD
   *
   * NAME OF OPERATORS
   ***************************************************/

  let operator =
    getOperatorName(
      data
    );


  if (!operator) {

    processing = false;

    showStatus(
      "Invalid QR code. Missing: NAME OF OPERATORS",
      "error"
    );

    showScanAgain();

    return;

  }


  /***************************************************
   * SAVE OPERATOR
   ***************************************************/

  scannedOperator =
    String(
      operator
    ).trim();


  /***************************************************
   * DISPLAY
   ***************************************************/

  document.getElementById(
    "operator"
  ).textContent =
    scannedOperator;


  document.getElementById(
    "date"
  ).textContent =
    formatToday();


  document.getElementById(
    "startTime"
  ).textContent =
    "Will be recorded when IN is pressed";


  document.getElementById(
    "endTime"
  ).textContent =
    "Will be recorded when OUT is pressed";


  document.getElementById(
    "operatingHrs"
  ).textContent =
    "Calculated after OUT";


  document.getElementById(
    "details"
  ).style.display =
    "block";


  document.getElementById(
    "buttons"
  ).style.display =
    "flex";


  document.getElementById(
    "scanAgain"
  ).style.display =
    "none";


  showStatus(
    "QR scanned successfully. Operator: " +
    scannedOperator,
    "success"
  );

}


/*******************************************************
 * GET OPERATOR NAME
 *
 * Accepts the actual QR format:
 *
 * {
 *   "NAME OF OPERATORS": "BADS"
 * }
 *
 * Also handles harmless differences in
 * capitalization/spaces.
 *******************************************************/

function getOperatorName(
  data
) {

  const keys =
    Object.keys(
      data
    );


  for (
    const key of keys
  ) {

    const normalized =
      String(key)
        .trim()
        .toLowerCase()
        .replace(
          /\s+/g,
          " "
        );


    if (
      normalized ===
      "name of operators"
    ) {

      return data[key];

    }

  }


  return null;

}


/*******************************************************
 * IN
 *******************************************************/

function recordIN() {

  if (!scannedOperator) {

    showStatus(
      "Please scan a QR code first.",
      "error"
    );

    return;

  }


  disableButtons();


  showStatus(
    "Recording IN...",
    "info"
  );


  sendToAppsScript(
    "IN"
  );

}


/*******************************************************
 * OUT
 *******************************************************/

function recordOUT() {

  if (!scannedOperator) {

    showStatus(
      "Please scan a QR code first.",
      "error"
    );

    return;

  }


  disableButtons();


  showStatus(
    "Recording OUT...",
    "info"
  );


  sendToAppsScript(
    "OUT"
  );

}


/*******************************************************
 * SEND TO GOOGLE APPS SCRIPT
 *******************************************************/

function sendToAppsScript(
  action
) {

  if (
    !APPS_SCRIPT_URL ||
    APPS_SCRIPT_URL.indexOf(
      "/exec"
    ) === -1
  ) {

    showStatus(
      "Please enter your Apps Script /exec URL in index.html.",
      "error"
    );

    enableButtons();

    return;

  }


  /***************************************************
   * Hidden iframe
   ***************************************************/

  const iframeName =
    "appsScriptResponseFrame";


  let iframe =
    document.getElementById(
      iframeName
    );


  if (!iframe) {

    iframe =
      document.createElement(
        "iframe"
      );

    iframe.id =
      iframeName;

    iframe.name =
      iframeName;

    iframe.style.display =
      "none";

    document.body.appendChild(
      iframe
    );

  }


  /***************************************************
   * Form
   ***************************************************/

  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    APPS_SCRIPT_URL;


  form.target =
    iframeName;


  form.style.display =
    "none";


  /***************************************************
   * Add field
   ***************************************************/

  function addField(
    name,
    value
  ) {

    const input =
      document.createElement(
        "input"
      );


    input.type =
      "hidden";


    input.name =
      name;


    input.value =
      value == null
        ? ""
        : String(value);


    form.appendChild(
      input
    );

  }


  /***************************************************
   * DATA
   ***************************************************/

  addField(
    "action",
    action
  );


  addField(
    "operator",
    scannedOperator
  );


  /*
   * This is the actual QR scan time.
   */
  addField(
    "scanTime",
    scanTime
  );


  document.body.appendChild(
    form
  );


  form.submit();


  /***************************************************
   * Wait for Apps Script
   ***************************************************/

  setTimeout(
    function() {

      showStatus(

        action === "IN"

          ? "✓ IN successfully recorded for " +
            scannedOperator

          : "✓ OUT successfully recorded for " +
            scannedOperator,

        "success"

      );


      form.remove();


      setTimeout(
        resetScanner,
        1800
      );

    },

    1500

  );

}


/*******************************************************
 * DISABLE BUTTONS
 *******************************************************/

function disableButtons() {

  document.getElementById(
    "inButton"
  ).disabled = true;


  document.getElementById(
    "outButton"
  ).disabled = true;

}


/*******************************************************
 * ENABLE BUTTONS
 *******************************************************/

function enableButtons() {

  document.getElementById(
    "inButton"
  ).disabled = false;


  document.getElementById(
    "outButton"
  ).disabled = false;

}


/*******************************************************
 * STOP CAMERA
 *******************************************************/

async function stopScanner() {

  if (!scanner) {
    return;
  }


  try {

    await scanner.stop();

  } catch (error) {}


  try {

    await scanner.clear();

  } catch (error) {}


  scanner = null;

}


/*******************************************************
 * SCAN AGAIN
 *******************************************************/

function showScanAgain() {

  document.getElementById(
    "scanAgain"
  ).style.display =
    "block";

}


/*******************************************************
 * RESET
 *******************************************************/

async function resetScanner() {

  await stopScanner();


  scannedOperator = null;

  scanTime = null;

  processing = false;


  document.getElementById(
    "details"
  ).style.display =
    "none";


  document.getElementById(
    "buttons"
  ).style.display =
    "none";


  document.getElementById(
    "scanAgain"
  ).style.display =
    "none";


  enableButtons();


  document.getElementById(
    "reader"
  ).innerHTML =
    "";


  document.getElementById(
    "operator"
  ).textContent =
    "";


  document.getElementById(
    "startTime"
  ).textContent =
    "—";


  document.getElementById(
    "endTime"
  ).textContent =
    "—";


  document.getElementById(
    "date"
  ).textContent =
    "";


  document.getElementById(
    "operatingHrs"
  ).textContent =
    "—";


  startScanner();

}


/*******************************************************
 * TODAY
 *******************************************************/

function formatToday() {

  const now =
    new Date();


  return now.toLocaleDateString(
    "en-PH",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }
  );

}


/*******************************************************
 * STATUS MESSAGE
 *******************************************************/

function showStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    type;


  status.style.display =
    "block";

}

</script>

</body>

</html>
