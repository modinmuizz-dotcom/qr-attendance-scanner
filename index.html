<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QR Attendance Scanner</title>


  <!-- HTML5 QR CODE -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode/minified/html5-qrcode.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      background: #f3f4f6;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    .container {

      width: 100%;

      max-width: 650px;

      margin: 0 auto;

      background: white;

      padding: 25px;

      border-radius: 20px;

      box-shadow:
        0 5px 25px rgba(
          0,
          0,
          0,
          0.10
        );

    }


    h1 {

      text-align: center;

      margin:
        0 0 20px 0;

      color: #111827;

      font-size: 28px;

    }


    /************************************************
     * STATUS
     ************************************************/

    #status {

      display: none;

      padding: 15px;

      margin-bottom: 20px;

      border-radius: 10px;

      text-align: center;

      font-size: 17px;

      font-weight: bold;

      line-height: 1.4;

    }


    .status-info {

      background: #e0f2fe;

      color: #075985;

    }


    .status-success {

      background: #dcfce7;

      color: #166534;

    }


    .status-error {

      background: #fee2e2;

      color: #991b1b;

    }


    /************************************************
     * CAMERA
     ************************************************/

    #reader {

      width: 100%;

      max-width: 500px;

      margin:
        10px auto 20px auto;

      overflow: hidden;

      border-radius: 15px;

    }


    .camera-help {

      text-align: center;

      color: #6b7280;

      font-size: 16px;

      margin-bottom: 20px;

    }


    /************************************************
     * DETAILS
     ************************************************/

    #details {

      display: none;

    }


    .detail {

      display: flex;

      justify-content:
        space-between;

      gap: 20px;

      padding: 16px 5px;

      border-bottom:
        1px solid #e5e7eb;

    }


    .label {

      font-weight: bold;

      color: #374151;

      font-size: 17px;

    }


    .value {

      color: #111827;

      text-align: right;

      font-size: 17px;

    }


    /************************************************
     * BUTTONS
     ************************************************/

    #buttons {

      display: none;

      gap: 15px;

      margin-top: 25px;

    }


    button {

      flex: 1;

      border: none;

      padding: 18px;

      border-radius: 12px;

      font-size: 20px;

      font-weight: bold;

      cursor: pointer;

    }


    button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

    }


    #inButton {

      background: #16a34a;

      color: white;

    }


    #outButton {

      background: #dc2626;

      color: white;

    }


    #scanAgain {

      display: none;

      width: 100%;

      margin-top: 20px;

      background: #2563eb;

      color: white;

    }


    /************************************************
     * MOBILE
     ************************************************/

    @media (
      max-width: 500px
    ) {

      body {

        padding: 10px;

      }


      .container {

        padding: 18px;

      }


      h1 {

        font-size: 25px;

      }


      .detail {

        display: block;

      }


      .label {

        display: block;

        margin-bottom: 5px;

      }


      .value {

        display: block;

        text-align: left;

      }


      #buttons {

        flex-direction: column;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <h1>
      QR Attendance Scanner
    </h1>


    <!-- STATUS -->

    <div
      id="status"
    ></div>


    <!-- CAMERA -->

    <div
      id="reader"
    ></div>


    <div class="camera-help">

      Scan the operator QR code.

    </div>


    <!-- DETAILS -->

    <div
      id="details"
    >


      <div class="detail">

        <span class="label">
          Operator / Driver
        </span>

        <span
          class="value"
          id="operator"
        ></span>

      </div>


      <div class="detail">

        <span class="label">
          Start Time
        </span>

        <span
          class="value"
          id="startTime"
        >—</span>

      </div>


      <div class="detail">

        <span class="label">
          End Time
        </span>

        <span
          class="value"
          id="endTime"
        >—</span>

      </div>


      <div class="detail">

        <span class="label">
          Date
        </span>

        <span
          class="value"
          id="date"
        ></span>

      </div>


      <div class="detail">

        <span class="label">
          Operating Hrs
        </span>

        <span
          class="value"
          id="operatingHrs"
        >—</span>

      </div>


    </div>


    <!-- IN / OUT BUTTONS -->

    <div
      id="buttons"
    >

      <button
        id="inButton"
        onclick="recordIN()"
      >
        IN
      </button>


      <button
        id="outButton"
        onclick="recordOUT()"
      >
        OUT
      </button>

    </div>


    <!-- SCAN AGAIN -->

    <button
      id="scanAgain"
      onclick="resetScanner()"
    >
      SCAN AGAIN
    </button>


  </div>


<script>


/********************************************************
 * GOOGLE APPS SCRIPT WEB APP URL
 *
 * REPLACE THIS WITH YOUR ACTUAL /exec URL.
 ********************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbw1oR1djrGmteZmTuS2Ba2Hist9HOAi0vVRusjEGTok7U-zP9chuZM7iBBXUA1TsiGxnA/exec";


/********************************************************
 * PHILIPPINE TIMEZONE
 ********************************************************/

const TIMEZONE =
  "Asia/Manila";


/********************************************************
 * VARIABLES
 ********************************************************/

let scanner =
  null;

let scannedOperator =
  null;

let scanTime =
  null;

let processing =
  false;

let sending =
  false;


/********************************************************
 * START
 ********************************************************/

window.addEventListener(
  "load",
  function () {

    startScanner();

  }
);


/********************************************************
 * START CAMERA
 ********************************************************/

async function startScanner() {

  try {

    showStatus(
      "Starting camera...",
      "info"
    );


    if (
      !window.isSecureContext
    ) {

      throw new Error(
        "HTTPS_REQUIRED"
      );

    }


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "CAMERA_NOT_SUPPORTED"
      );

    }


    /*
     * Request camera permission.
     */

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            }

          },

          audio: false

        });


    /*
     * Stop permission-test stream.
     */

    stream
      .getTracks()
      .forEach(
        function (track) {

          track.stop();

        }
      );


    createScanner();

  }

  catch (error) {

    console.error(
      "Camera error:",
      error
    );


    let message =
      "Unable to open camera.";


    if (
      error.name ===
      "NotAllowedError"
    ) {

      message =
        "Camera permission was denied. Please allow camera access.";

    }


    else if (
      error.name ===
      "NotFoundError"
    ) {

      message =
        "No camera was found.";

    }


    else if (
      error.name ===
      "NotReadableError"
    ) {

      message =
        "The camera is being used by another application.";

    }


    else if (
      error.message ===
      "HTTPS_REQUIRED"
    ) {

      message =
        "Camera requires HTTPS. Please use the GitHub Pages HTTPS address.";

    }


    else if (
      error.message ===
      "CAMERA_NOT_SUPPORTED"
    ) {

      message =
        "This browser does not support camera access.";

    }


    showStatus(
      message,
      "error"
    );

  }

}


/********************************************************
 * CREATE SCANNER
 ********************************************************/

function createScanner() {

  document.getElementById(
    "reader"
  ).innerHTML =
    "";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const width =
    document.getElementById(
      "reader"
    ).clientWidth || 300;


  const qrSize =
    Math.min(
      Math.max(
        width * 0.70,
        220
      ),
      350
    );


  scanner
    .start(

      {
        facingMode:
          "environment"
      },

      {

        fps: 10,

        qrbox: {

          width: qrSize,

          height: qrSize

        },

        aspectRatio: 1.0

      },

      onScanSuccess,

      onScanFailure

    )

    .then(
      function () {

        showStatus(
          "Camera ready. Scan an operator QR code.",
          "success"
        );

      }
    )

    .catch(
      function (error) {

        console.error(
          "Scanner error:",
          error
        );


        showStatus(
          "Unable to start the QR scanner.",
          "error"
        );

      }
    );

}


/********************************************************
 * QR SCAN FAILURE
 ********************************************************/

function onScanFailure() {

  /*
   * Ignore normal scanning failures.
   */

}


/********************************************************
 * QR SCAN SUCCESS
 ********************************************************/

async function onScanSuccess(
  decodedText
) {

  if (
    processing
  ) {

    return;

  }


  processing =
    true;


  /*
   * Capture EXACT browser time when
   * the QR code was successfully scanned.
   *
   * ISO timestamp is an absolute timestamp.
   */

  scanTime =
    new Date()
      .toISOString();


  /*
   * Stop camera.
   */

  await stopScanner();


  let qrData;


  /******************************************************
   * PARSE QR JSON
   ******************************************************/

  try {

    qrData =
      JSON.parse(
        decodedText
      );

  }

  catch (error) {

    processing =
      false;


    showStatus(
      "Invalid QR code. The QR must contain JSON.",
      "error"
    );


    showScanAgain();


    return;

  }


  /******************************************************
   * CHECK OBJECT
   ******************************************************/

  if (
    !qrData ||
    typeof qrData !== "object" ||
    Array.isArray(qrData)
  ) {

    processing =
      false;


    showStatus(
      "Invalid QR data.",
      "error"
    );


    showScanAgain();


    return;

  }


  /******************************************************
   * GET OPERATOR
   ******************************************************/

  const operator =
    getOperatorFromQR(
      qrData
    );


  if (!operator) {

    processing =
      false;


    showStatus(
      "Invalid QR code. Missing: NAME OF OPERATORS",
      "error"
    );


    showScanAgain();


    return;

  }


  /******************************************************
   * SAVE OPERATOR
   ******************************************************/

  scannedOperator =
    String(
      operator
    ).trim();


  /******************************************************
   * DISPLAY OPERATOR
   ******************************************************/

  document.getElementById(
    "operator"
  ).textContent =
    scannedOperator;


  /******************************************************
   * DISPLAY PHILIPPINE SCAN TIME
   ******************************************************/

  document.getElementById(
    "startTime"
  ).textContent =
    formatPhilippineTime(
      new Date(
        scanTime
      )
    );


  /******************************************************
   * END TIME
   ******************************************************/

  document.getElementById(
    "endTime"
  ).textContent =
    "Will be recorded when OUT is pressed";


  /******************************************************
   * DATE
   ******************************************************/

  document.getElementById(
    "date"
  ).textContent =
    formatPhilippineDate(
      new Date(
        scanTime
      )
    );


  /******************************************************
   * OPERATING HOURS
   ******************************************************/

  document.getElementById(
    "operatingHrs"
  ).textContent =
    "Calculated after OUT";


  /******************************************************
   * SHOW DETAILS
   ******************************************************/

  document.getElementById(
    "details"
  ).style.display =
    "block";


  /******************************************************
   * SHOW BUTTONS
   ******************************************************/

  document.getElementById(
    "buttons"
  ).style.display =
    "flex";


  document.getElementById(
    "scanAgain"
  ).style.display =
    "none";


  /******************************************************
   * STATUS
   ******************************************************/

  showStatus(
    "QR scanned successfully. Operator: " +
    scannedOperator,
    "success"
  );

}


/********************************************************
 * GET OPERATOR FROM QR
 *
 * ACTUAL FORMAT:
 *
 * {
 *   "NAME OF OPERATORS": "BADS"
 * }
 ********************************************************/

function getOperatorFromQR(
  data
) {

  const keys =
    Object.keys(
      data
    );


  for (
    let i = 0;
    i < keys.length;
    i++
  ) {

    const normalized =
      String(
        keys[i]
      )
      .trim()
      .toLowerCase()
      .replace(
        /\s+/g,
        " "
      );


    if (
      normalized ===
      "name of operators"
    ) {

      const value =
        data[
          keys[i]
        ];


      if (
        value !== undefined &&
        value !== null &&
        String(
          value
        ).trim() !== ""
      ) {

        return value;

      }

    }

  }


  return null;

}


/********************************************************
 * RECORD IN
 ********************************************************/

function recordIN() {

  if (
    !scannedOperator
  ) {

    showStatus(
      "Please scan an operator QR code first.",
      "error"
    );

    return;

  }


  if (
    sending
  ) {

    return;

  }


  sending =
    true;


  disableButtons();


  showStatus(
    "Recording IN for " +
    scannedOperator +
    "...",
    "info"
  );


  sendToAppsScript(
    "IN"
  );

}


/********************************************************
 * RECORD OUT
 ********************************************************/

function recordOUT() {

  if (
    !scannedOperator
  ) {

    showStatus(
      "Please scan an operator QR code first.",
      "error"
    );

    return;

  }


  if (
    sending
  ) {

    return;

  }


  sending =
    true;


  disableButtons();


  showStatus(
    "Recording OUT for " +
    scannedOperator +
    "...",
    "info"
  );


  /*
   * OUT time is generated RIGHT NOW.
   */

  sendToAppsScript(
    "OUT"
  );

}


/********************************************************
 * SEND TO GOOGLE APPS SCRIPT
 ********************************************************/

function sendToAppsScript(
  action
) {

  /******************************************************
   * CHECK URL
   ******************************************************/

  if (
    !APPS_SCRIPT_URL ||
    APPS_SCRIPT_URL.indexOf(
      "/exec"
    ) === -1
  ) {

    sending =
      false;


    enableButtons();


    showStatus(
      "Please enter your Apps Script /exec URL in index.html.",
      "error"
    );


    return;

  }


  /******************************************************
   * ACTION TIME
   *
   * IN  = QR scan time
   * OUT = actual OUT button time
   ******************************************************/

  let actionTime;


  if (
    action === "IN"
  ) {

    actionTime =
      scanTime;

  }

  else {

    actionTime =
      new Date()
        .toISOString();

  }


  /******************************************************
   * HIDDEN IFRAME
   ******************************************************/

  const iframeName =
    "appsScriptResponseFrame";


  let iframe =
    document.getElementById(
      iframeName
    );


  if (!iframe) {

    iframe =
      document.createElement(
        "iframe"
      );


    iframe.id =
      iframeName;


    iframe.name =
      iframeName;


    iframe.style.display =
      "none";


    document.body.appendChild(
      iframe
    );

  }


  /******************************************************
   * FORM
   ******************************************************/

  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    APPS_SCRIPT_URL;


  form.target =
    iframeName;


  form.style.display =
    "none";


  /******************************************************
   * ADD FIELD
   ******************************************************/

  function addField(
    name,
    value
  ) {

    const input =
      document.createElement(
        "input"
      );


    input.type =
      "hidden";


    input.name =
      name;


    input.value =
      value == null
        ? ""
        : String(
            value
          );


    form.appendChild(
      input
    );

  }


  /******************************************************
   * SEND DATA
   ******************************************************/

  addField(
    "action",
    action
  );


  addField(
    "operator",
    scannedOperator
  );


  addField(
    "scanTime",
    actionTime
  );


  document.body.appendChild(
    form
  );


  /******************************************************
   * SUBMIT
   ******************************************************/

  form.submit();


  /******************************************************
   * SHOW RESULT
   ******************************************************/

  setTimeout(
    function () {

      if (
        action === "IN"
      ) {

        showStatus(
          "✓ IN recorded for " +
          scannedOperator +
          " at " +
          formatPhilippineTime(
            new Date(
              actionTime
            )
          ),
          "success"
        );

      }

      else {

        showStatus(
          "✓ OUT recorded for " +
          scannedOperator +
          " at " +
          formatPhilippineTime(
            new Date(
              actionTime
            )
          ),
          "success"
        );

      }


      form.remove();


      sending =
        false;


      /**************************************************
       * AUTOMATICALLY PREPARE NEXT SCAN
       **************************************************/

      setTimeout(
        function () {

          resetScanner();

        },
        2000
      );


    },
    1500
  );

}


/********************************************************
 * STOP CAMERA
 ********************************************************/

async function stopScanner() {

  if (!scanner) {

    return;

  }


  try {

    await scanner.stop();

  }

  catch (error) {

    console.log(
      "Scanner stop:",
      error
    );

  }


  try {

    await scanner.clear();

  }

  catch (error) {

    console.log(
      "Scanner clear:",
      error
    );

  }


  scanner =
    null;

}


/********************************************************
 * RESET SCANNER
 ********************************************************/

async function resetScanner() {

  await stopScanner();


  scannedOperator =
    null;


  scanTime =
    null;


  processing =
    false;


  sending =
    false;


  /******************************************************
   * HIDE DETAILS
   ******************************************************/

  document.getElementById(
    "details"
  ).style.display =
    "none";


  /******************************************************
   * HIDE BUTTONS
   ******************************************************/

  document.getElementById(
    "buttons"
  ).style.display =
    "none";


  /******************************************************
   * HIDE SCAN AGAIN
   ******************************************************/

  document.getElementById(
    "scanAgain"
  ).style.display =
    "none";


  /******************************************************
   * ENABLE BUTTONS
   ******************************************************/

  enableButtons();


  /******************************************************
   * CLEAR VALUES
   ******************************************************/

  document.getElementById(
    "operator"
  ).textContent =
    "";


  document.getElementById(
    "startTime"
  ).textContent =
    "—";


  document.getElementById(
    "endTime"
  ).textContent =
    "—";


  document.getElementById(
    "date"
  ).textContent =
    "";


  document.getElementById(
    "operatingHrs"
  ).textContent =
    "—";


  /******************************************************
   * CLEAR CAMERA
   ******************************************************/

  document.getElementById(
    "reader"
  ).innerHTML =
    "";


  /******************************************************
   * START AGAIN
   ******************************************************/

  startScanner();

}


/********************************************************
 * DISABLE BUTTONS
 ********************************************************/

function disableButtons() {

  document.getElementById(
    "inButton"
  ).disabled =
    true;


  document.getElementById(
    "outButton"
  ).disabled =
    true;

}


/********************************************************
 * ENABLE BUTTONS
 ********************************************************/

function enableButtons() {

  document.getElementById(
    "inButton"
  ).disabled =
    false;


  document.getElementById(
    "outButton"
  ).disabled =
    false;

}


/********************************************************
 * PHILIPPINE DATE
 ********************************************************/

function formatPhilippineDate(
  date
) {

  return new Intl.DateTimeFormat(
    "en-PH",
    {

      timeZone:
        TIMEZONE,

      year:
        "numeric",

      month:
        "2-digit",

      day:
        "2-digit"

    }
  ).format(
    date
  );

}


/********************************************************
 * PHILIPPINE TIME
 ********************************************************/

function formatPhilippineTime(
  date
) {

  return new Intl.DateTimeFormat(
    "en-PH",
    {

      timeZone:
        TIMEZONE,

      hour:
        "numeric",

      minute:
        "2-digit",

      second:
        "2-digit",

      hour12:
        true

    }
  ).format(
    date
  );

}


/********************************************************
 * SHOW STATUS
 ********************************************************/

function showStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    "";


  if (
    type === "info"
  ) {

    status.classList.add(
      "status-info"
    );

  }


  else if (
    type === "success"
  ) {

    status.classList.add(
      "status-success"
    );

  }


  else if (
    type === "error"
  ) {

    status.classList.add(
      "status-error"
    );

  }


  status.style.display =
    "block";

}


/********************************************************
 * SHOW SCAN AGAIN
 ********************************************************/

function showScanAgain() {

  document.getElementById(
    "scanAgain"
  ).style.display =
    "block";

}

</script>


</body>

</html>
