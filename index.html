<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QR Attendance Scanner</title>


  <!-- HTML5 QR CODE LIBRARY -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode/minified/html5-qrcode.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      background: #f3f4f6;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    .container {

      width: 100%;

      max-width: 650px;

      margin: 0 auto;

      background: #ffffff;

      padding: 25px;

      border-radius: 18px;

      box-shadow:
        0 5px 25px rgba(0, 0, 0, 0.10);

    }


    h1 {

      margin: 0 0 20px 0;

      text-align: center;

      color: #111827;

      font-size: 28px;

    }


    /* STATUS */

    #status {

      display: none;

      padding: 15px;

      margin-bottom: 18px;

      border-radius: 10px;

      text-align: center;

      font-size: 17px;

      font-weight: bold;

      line-height: 1.4;

    }


    .status-info {

      background: #e0f2fe;

      color: #075985;

    }


    .status-success {

      background: #dcfce7;

      color: #166534;

    }


    .status-error {

      background: #fee2e2;

      color: #991b1b;

    }


    /* CAMERA */

    #reader {

      width: 100%;

      max-width: 500px;

      margin: 15px auto 20px auto;

      overflow: hidden;

      border-radius: 15px;

    }


    .camera-help {

      text-align: center;

      color: #6b7280;

      font-size: 14px;

      margin: 10px 0 20px 0;

    }


    /* DETAILS */

    #details {

      display: none;

      margin-top: 15px;

    }


    .detail {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      padding: 15px 5px;

      border-bottom: 1px solid #e5e7eb;

    }


    .label {

      font-weight: bold;

      color: #374151;

      font-size: 17px;

    }


    .value {

      color: #111827;

      text-align: right;

      font-size: 17px;

      word-break: break-word;

    }


    /* BUTTONS */

    #buttons {

      display: none;

      gap: 15px;

      margin-top: 25px;

    }


    button {

      flex: 1;

      border: none;

      padding: 18px;

      border-radius: 12px;

      font-size: 20px;

      font-weight: bold;

      cursor: pointer;

      transition: opacity 0.2s;

    }


    button:disabled {

      opacity: 0.50;

      cursor: not-allowed;

    }


    #inButton {

      background: #16a34a;

      color: white;

    }


    #outButton {

      background: #dc2626;

      color: white;

    }


    #scanAgain {

      display: none;

      width: 100%;

      margin-top: 15px;

      background: #2563eb;

      color: white;

    }


    /* MOBILE */

    @media (max-width: 500px) {

      body {

        padding: 10px;

      }


      .container {

        padding: 18px;

      }


      h1 {

        font-size: 24px;

      }


      .detail {

        display: block;

      }


      .label {

        display: block;

        margin-bottom: 6px;

      }


      .value {

        display: block;

        text-align: left;

      }


      #buttons {

        flex-direction: column;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <h1>
      QR Attendance Scanner
    </h1>


    <!-- STATUS MESSAGE -->

    <div id="status"></div>


    <!-- CAMERA -->

    <div id="reader"></div>


    <div class="camera-help">

      Scan the operator QR code.

    </div>


    <!-- SCANNED INFORMATION -->

    <div id="details">


      <div class="detail">

        <span class="label">
          Operator / Driver
        </span>

        <span
          class="value"
          id="operator"
        ></span>

      </div>


      <div class="detail">

        <span class="label">
          Start Time
        </span>

        <span
          class="value"
          id="startTime"
        >—</span>

      </div>


      <div class="detail">

        <span class="label">
          End Time
        </span>

        <span
          class="value"
          id="endTime"
        >—</span>

      </div>


      <div class="detail">

        <span class="label">
          Date
        </span>

        <span
          class="value"
          id="date"
        ></span>

      </div>


      <div class="detail">

        <span class="label">
          Operating Hrs
        </span>

        <span
          class="value"
          id="operatingHrs"
        >—</span>

      </div>


    </div>


    <!-- IN / OUT -->

    <div id="buttons">

      <button
        id="inButton"
        onclick="recordIN()"
      >
        IN
      </button>


      <button
        id="outButton"
        onclick="recordOUT()"
      >
        OUT
      </button>

    </div>


    <!-- SCAN AGAIN -->

    <button
      id="scanAgain"
      onclick="resetScanner()"
    >
      SCAN AGAIN
    </button>


  </div>


<script>


/********************************************************
 * IMPORTANT
 *
 * PUT YOUR GOOGLE APPS SCRIPT WEB APP /exec URL HERE.
 *
 * Example:
 *
 * const APPS_SCRIPT_URL =
 *   "https://script.google.com/macros/s/XXXXXXXX/exec";
 ********************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyGJWOpgT2ULMbXR1KDRfSz6j79iyfZ9QSaEGvxuP1B-74lYZRnLCQdPdazMLOFsCn4/exec";


/********************************************************
 * GLOBAL VARIABLES
 ********************************************************/

let scanner = null;

let scannedOperator = null;

let scanTime = null;

let processing = false;

let sending = false;


/********************************************************
 * START APPLICATION
 ********************************************************/

window.addEventListener(
  "load",
  function () {

    startScanner();

  }
);


/********************************************************
 * START CAMERA
 ********************************************************/

async function startScanner() {

  try {

    /*
     * Camera requires HTTPS.
     */

    if (
      !window.isSecureContext
    ) {

      throw new Error(
        "HTTPS_REQUIRED"
      );

    }


    /*
     * Check camera support.
     */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "CAMERA_NOT_SUPPORTED"
      );

    }


    showStatus(
      "Requesting camera permission...",
      "info"
    );


    /*
     * Ask browser for camera permission.
     */

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            }

          },

          audio: false

        });


    /*
     * We only use this request to obtain
     * permission. html5-qrcode will open
     * the camera afterward.
     */

    stream
      .getTracks()
      .forEach(
        function (track) {

          track.stop();

        }
      );


    createScanner();


  }

  catch (error) {

    console.error(
      "Camera error:",
      error
    );


    let message =
      "Unable to open camera.";


    if (
      error.message ===
      "HTTPS_REQUIRED"
    ) {

      message =
        "Camera requires HTTPS. Open this page from GitHub Pages.";

    }


    else if (
      error.name ===
      "NotAllowedError"
    ) {

      message =
        "Camera permission was denied. Allow camera access and reload the page.";

    }


    else if (
      error.name ===
      "NotFoundError"
    ) {

      message =
        "No camera was found on this device.";

    }


    else if (
      error.name ===
      "NotReadableError"
    ) {

      message =
        "The camera is being used by another application.";

    }


    else if (
      error.message ===
      "CAMERA_NOT_SUPPORTED"
    ) {

      message =
        "This browser does not support camera access.";

    }


    showStatus(
      message,
      "error"
    );

  }

}


/********************************************************
 * CREATE QR SCANNER
 ********************************************************/

function createScanner() {

  /*
   * Clear old scanner.
   */

  document.getElementById(
    "reader"
  ).innerHTML = "";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const readerWidth =
    document.getElementById(
      "reader"
    ).clientWidth || 300;


  const qrSize =
    Math.min(
      Math.max(
        readerWidth * 0.70,
        220
      ),
      350
    );


  scanner
    .start(

      {
        facingMode:
          "environment"
      },

      {

        fps: 10,

        qrbox: {

          width: qrSize,

          height: qrSize

        },

        aspectRatio: 1.0

      },

      onScanSuccess,

      onScanFailure

    )

    .then(

      function () {

        showStatus(
          "Camera ready. Scan an operator QR code.",
          "success"
        );

      }

    )

    .catch(

      function (error) {

        console.error(
          "Scanner start error:",
          error
        );


        showStatus(
          "Unable to start the QR scanner. Please check camera permission.",
          "error"
        );

      }

    );

}


/********************************************************
 * NORMAL QR SCAN FAILURES
 ********************************************************/

function onScanFailure() {

  /*
   * QR scanners call this continuously while
   * looking for a QR code.
   *
   * Do nothing.
   */

}


/********************************************************
 * SUCCESSFUL QR SCAN
 ********************************************************/

async function onScanSuccess(
  decodedText
) {

  /*
   * Prevent multiple callbacks for
   * the same QR code.
   */

  if (processing) {

    return;

  }


  processing = true;


  /*
   * IMPORTANT:
   *
   * This is the actual moment the QR
   * code was successfully scanned.
   */

  scanTime =
    new Date()
      .toISOString();


  /*
   * Stop camera after successful scan.
   */

  await stopScanner();


  let qrData;


  /******************************************************
   * PARSE JSON
   ******************************************************/

  try {

    qrData =
      JSON.parse(
        decodedText
      );

  }

  catch (error) {

    processing = false;


    showStatus(
      "Invalid QR code. The QR code must contain JSON.",
      "error"
    );


    showScanAgain();


    return;

  }


  /******************************************************
   * MAKE SURE IT IS AN OBJECT
   ******************************************************/

  if (
    !qrData ||
    typeof qrData !== "object" ||
    Array.isArray(qrData)
  ) {

    processing = false;


    showStatus(
      "Invalid QR data.",
      "error"
    );


    showScanAgain();


    return;

  }


  /******************************************************
   * ACTUAL QR FIELD:
   *
   * NAME OF OPERATORS
   ******************************************************/

  const operator =
    getOperatorFromQR(
      qrData
    );


  if (!operator) {

    processing = false;


    showStatus(
      "Invalid QR code. Missing: NAME OF OPERATORS",
      "error"
    );


    showScanAgain();


    return;

  }


  /******************************************************
   * SAVE OPERATOR
   ******************************************************/

  scannedOperator =
    String(
      operator
    ).trim();


  /******************************************************
   * DISPLAY OPERATOR
   ******************************************************/

  document.getElementById(
    "operator"
  ).textContent =
    scannedOperator;


  /******************************************************
   * DISPLAY SCAN TIME
   ******************************************************/

  document.getElementById(
    "startTime"
  ).textContent =
    formatTime(
      new Date(
        scanTime
      )
    );


  /******************************************************
   * END TIME
   ******************************************************/

  document.getElementById(
    "endTime"
  ).textContent =
    "Will be recorded when OUT is pressed";


  /******************************************************
   * DATE
   ******************************************************/

  document.getElementById(
    "date"
  ).textContent =
    formatDate(
      new Date(
        scanTime
      )
    );


  /******************************************************
   * OPERATING HOURS
   ******************************************************/

  document.getElementById(
    "operatingHrs"
  ).textContent =
    "Calculated after OUT";


  /******************************************************
   * SHOW DETAILS
   ******************************************************/

  document.getElementById(
    "details"
  ).style.display =
    "block";


  /******************************************************
   * SHOW IN / OUT
   ******************************************************/

  document.getElementById(
    "buttons"
  ).style.display =
    "flex";


  document.getElementById(
    "scanAgain"
  ).style.display =
    "none";


  /******************************************************
   * SUCCESS MESSAGE
   ******************************************************/

  showStatus(
    "QR scanned successfully. Operator: " +
    scannedOperator,
    "success"
  );

}


/********************************************************
 * GET OPERATOR FROM ACTUAL QR
 *
 * Actual QR:
 *
 * {
 *   "NAME OF OPERATORS": "BADS"
 * }
 *
 * This function also tolerates:
 *
 * "Name of Operators"
 * "name of operators"
 * " NAME OF OPERATORS "
 ********************************************************/

function getOperatorFromQR(
  data
) {

  const keys =
    Object.keys(
      data
    );


  for (
    let i = 0;
    i < keys.length;
    i++
  ) {

    const key =
      String(
        keys[i]
      )
      .trim()
      .toLowerCase()
      .replace(
        /\s+/g,
        " "
      );


    if (
      key ===
      "name of operators"
    ) {

      const value =
        data[
          keys[i]
        ];


      if (
        value !== undefined &&
        value !== null &&
        String(value).trim() !== ""
      ) {

        return value;

      }

    }

  }


  return null;

}


/********************************************************
 * RECORD IN
 ********************************************************/

function recordIN() {

  if (!scannedOperator) {

    showStatus(
      "Please scan an operator QR code first.",
      "error"
    );

    return;

  }


  if (sending) {

    return;

  }


  sending = true;


  disableButtons();


  showStatus(
    "Recording IN for " +
    scannedOperator +
    "...",
    "info"
  );


  sendToAppsScript(
    "IN"
  );

}


/********************************************************
 * RECORD OUT
 ********************************************************/

function recordOUT() {

  if (!scannedOperator) {

    showStatus(
      "Please scan an operator QR code first.",
      "error"
    );

    return;

  }


  if (sending) {

    return;

  }


  sending = true;


  disableButtons();


  showStatus(
    "Recording OUT for " +
    scannedOperator +
    "...",
    "info"
  );


  /*
   * For OUT we want the actual
   * OUT button time.
   */

  sendToAppsScript(
    "OUT"
  );

}


/********************************************************
 * SEND DATA TO GOOGLE APPS SCRIPT
 ********************************************************/

function sendToAppsScript(
  action
) {

  /******************************************************
   * CHECK URL
   ******************************************************/

  if (
    !APPS_SCRIPT_URL ||
    APPS_SCRIPT_URL.indexOf(
      "/exec"
    ) === -1
  ) {

    sending = false;


    enableButtons();


    showStatus(
      "Apps Script URL is missing. Please put your /exec URL in index.html.",
      "error"
    );


    return;

  }


  /******************************************************
   * IMPORTANT TIME
   *
   * IN:
   *     use QR scan time
   *
   * OUT:
   *     use actual OUT button time
   ******************************************************/

  let actionTime;


  if (
    action === "IN"
  ) {

    actionTime =
      scanTime;

  }

  else {

    actionTime =
      new Date()
        .toISOString();

  }


  /******************************************************
   * HIDDEN IFRAME
   ******************************************************/

  const iframeName =
    "appsScriptResponseFrame";


  let iframe =
    document.getElementById(
      iframeName
    );


  if (!iframe) {

    iframe =
      document.createElement(
        "iframe"
      );


    iframe.id =
      iframeName;


    iframe.name =
      iframeName;


    iframe.style.display =
      "none";


    document.body.appendChild(
      iframe
    );

  }


  /******************************************************
   * FORM
   ******************************************************/

  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    APPS_SCRIPT_URL;


  form.target =
    iframeName;


  form.style.display =
    "none";


  /******************************************************
   * ADD FORM FIELD
   ******************************************************/

  function addField(
    name,
    value
  ) {

    const input =
      document.createElement(
        "input"
      );


    input.type =
      "hidden";


    input.name =
      name;


    input.value =
      value == null
        ? ""
        : String(value);


    form.appendChild(
      input
    );

  }


  /******************************************************
   * SEND ACTION
   ******************************************************/

  addField(
    "action",
    action
  );


  /******************************************************
   * SEND OPERATOR
   *
   * Apps Script receives this as:
   *
   * e.parameter.operator
   ******************************************************/

  addField(
    "operator",
    scannedOperator
  );


  /******************************************************
   * SEND SCAN / ACTION TIME
   ******************************************************/

  addField(
    "scanTime",
    actionTime
  );


  /******************************************************
   * SUBMIT
   ******************************************************/

  document.body.appendChild(
    form
  );


  form.submit();


  /******************************************************
   * IMPORTANT
   *
   * Because GitHub Pages and Apps Script are different
   * domains, the browser does not allow this page to
   * directly read the Apps Script response.
   *
   * We therefore wait for the request to complete and
   * then reset the scanner.
   ******************************************************/

  setTimeout(
    function () {

      if (
        action === "IN"
      ) {

        showStatus(
          "✓ IN request sent for " +
          scannedOperator +
          ".",
          "success"
        );

      }

      else {

        showStatus(
          "✓ OUT request sent for " +
          scannedOperator +
          ".",
          "success"
        );

      }


      form.remove();


      sending = false;


      /*
       * Start a fresh scan automatically.
       */

      setTimeout(
        resetScanner,
        1800
      );


    },
    1500
  );

}


/********************************************************
 * DISABLE IN / OUT
 ********************************************************/

function disableButtons() {

  document.getElementById(
    "inButton"
  ).disabled =
    true;


  document.getElementById(
    "outButton"
  ).disabled =
    true;

}


/********************************************************
 * ENABLE IN / OUT
 ********************************************************/

function enableButtons() {

  document.getElementById(
    "inButton"
  ).disabled =
    false;


  document.getElementById(
    "outButton"
  ).disabled =
    false;

}


/********************************************************
 * STOP SCANNER
 ********************************************************/

async function stopScanner() {

  if (!scanner) {

    return;

  }


  try {

    await scanner.stop();

  }

  catch (error) {

    console.log(
      "Scanner stop:",
      error
    );

  }


  try {

    await scanner.clear();

  }

  catch (error) {

    console.log(
      "Scanner clear:",
      error
    );

  }


  scanner = null;

}


/********************************************************
 * SHOW SCAN AGAIN
 ********************************************************/

function showScanAgain() {

  document.getElementById(
    "scanAgain"
  ).style.display =
    "block";

}


/********************************************************
 * RESET EVERYTHING
 ********************************************************/

async function resetScanner() {

  await stopScanner();


  scannedOperator =
    null;


  scanTime =
    null;


  processing =
    false;


  sending =
    false;


  /******************************************************
   * HIDE DETAILS
   ******************************************************/

  document.getElementById(
    "details"
  ).style.display =
    "none";


  /******************************************************
   * HIDE BUTTONS
   ******************************************************/

  document.getElementById(
    "buttons"
  ).style.display =
    "none";


  /******************************************************
   * HIDE SCAN AGAIN
   ******************************************************/

  document.getElementById(
    "scanAgain"
  ).style.display =
    "none";


  /******************************************************
   * ENABLE BUTTONS
   ******************************************************/

  enableButtons();


  /******************************************************
   * CLEAR DISPLAY
   ******************************************************/

  document.getElementById(
    "operator"
  ).textContent =
    "";


  document.getElementById(
    "startTime"
  ).textContent =
    "—";


  document.getElementById(
    "endTime"
  ).textContent =
    "—";


  document.getElementById(
    "date"
  ).textContent =
    "";


  document.getElementById(
    "operatingHrs"
  ).textContent =
    "—";


  /******************************************************
   * CLEAR CAMERA AREA
   ******************************************************/

  document.getElementById(
    "reader"
  ).innerHTML =
    "";


  /******************************************************
   * START CAMERA AGAIN
   ******************************************************/

  startScanner();

}


/********************************************************
 * FORMAT TIME
 ********************************************************/

function formatTime(
  date
) {

  return date.toLocaleTimeString(
    "en-PH",
    {

      hour:
        "numeric",

      minute:
        "2-digit",

      second:
        "2-digit"

    }
  );

}


/********************************************************
 * FORMAT DATE
 ********************************************************/

function formatDate(
  date
) {

  return date.toLocaleDateString(
    "en-PH",
    {

      year:
        "numeric",

      month:
        "2-digit",

      day:
        "2-digit"

    }
  );

}


/********************************************************
 * SHOW STATUS
 ********************************************************/

function showStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    "";


  if (
    type === "info"
  ) {

    status.classList.add(
      "status-info"
    );

  }


  else if (
    type === "success"
  ) {

    status.classList.add(
      "status-success"
    );

  }


  else if (
    type === "error"
  ) {

    status.classList.add(
      "status-error"
    );

  }


  status.style.display =
    "block";

}

</script>

</body>

</html>
